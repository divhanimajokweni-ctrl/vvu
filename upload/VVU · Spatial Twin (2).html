<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VVU · Spatial Twin</title>
<style>
:root{--bg:#07090a;--panel:#101417;--line:#26302b;--ink:#e6efe8;--dim:#8a9a90;--lime:#a3e635;--amber:#ffb224;--red:#e5484d;--cyan:#00e5ff;--f:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--f)}
body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "stage" "dock"}
header{grid-area:top;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{color:var(--lime)}#mode{margin-left:auto;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{grid-area:stage;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#notice{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--bg);color:var(--red)}
#hud{position:absolute;left:8px;right:8px;top:8px;padding:8px 10px;background:rgba(7,9,10,.86);border:1px solid var(--line);border-radius:4px;pointer-events:none}
#hud .r{display:flex;justify-content:space-between;gap:12px}#hud .r span:first-child{color:var(--dim)}
#dock{grid-area:dock;background:var(--panel);border-top:1px solid var(--line);display:grid;gap:6px;padding:6px 8px}
.scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
button{font:inherit;color:var(--ink);background:#162019;border:1px solid var(--line);border-radius:4px;padding:6px 10px;min-height:40px;white-space:nowrap;cursor:pointer}
button[aria-pressed=true],button[aria-selected=true]{border-color:var(--lime);color:var(--lime)}
button[aria-disabled=true]{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
#tlwrap{display:grid;gap:3px}#tlh{display:flex;justify-content:space-between;color:var(--dim);font-size:11px}
#tl{height:30px;background:#0a0f12;border:1px solid var(--line);border-radius:2px;display:flex;align-items:stretch;justify-content:flex-end;gap:2px;overflow:hidden;padding:3px}
.m{flex:0 0 6px;border-radius:1px}.gap{flex:0 0 auto;min-width:36px;color:var(--red);font-size:10px;line-height:22px;text-align:center;background:repeating-linear-gradient(135deg,#2a1214 0 4px,#12080a 4px 8px)}
#note{color:var(--dim);font-size:11px}
@media(min-width:900px){
 #app{grid-template-columns:270px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "side stage" "side dock"}
 #side{grid-area:side;display:flex!important}
 #hud{left:auto;width:280px;right:12px;top:12px}
 #surf{display:none}
}
#side{grid-area:side;display:none;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
#side button{border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;width:100%;white-space:normal}
#side small{display:block;color:var(--dim)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
#add{min-height:34px;padding:2px 10px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--lime);border-radius:6px;padding:14px;width:min(440px,calc(100vw - 24px));font:inherit}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{margin:0 0 8px;font-size:14px;color:var(--lime)}
dialog label{display:block;margin-top:8px;color:var(--dim)}
dialog input,dialog select{width:100%;min-height:40px;margin-top:2px;background:#0a0f12;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:inherit}
dialog input:focus-visible,dialog select:focus-visible{outline:2px solid var(--cyan)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#e-err{color:var(--red);min-height:18px;margin-top:6px}#e-res{white-space:pre-wrap;word-break:break-all;color:var(--lime);margin:6px 0 0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
</style>
</head>
<body>
<div id="app">
 <header><b>VVU · Spatial Twin</b><span id="mode"></span><button id="add">+ enrol device</button></header>
 <nav id="side" aria-label="Surfaces"></nav>
 <div id="stage"><canvas id="c"></canvas><div id="hud"></div><div id="notice" role="alert"></div></div>
 <div id="dock">
  <div class="scroll" id="surf" role="tablist" aria-label="Surfaces"></div>
  <div class="scroll" id="chips" role="group" aria-label="Assets"></div>
  <div id="tlwrap"><div id="tlh"><span>Evidence beats · simulated feed</span><button id="pickb" hidden style="min-height:28px;padding:2px 8px">load files</button><input id="pf" type="file" multiple hidden accept=".fbx,.glb,.gltf,.bin,.png,.jpg,.jpeg"><button id="tex" hidden aria-pressed="false" style="min-height:28px;padding:2px 8px">textured</button><button id="out" aria-pressed="false" style="min-height:28px;padding:2px 8px">simulate outage</button></div><div id="tl"></div></div>
  <div id="note">Positions are Mercator-projected from lat/lng. The chain proves records were not altered, not that a sensor told the truth. No signatures are checked in this page.</div>
 </div>
</div>
<dialog id="enrol" aria-labelledby="eh"><form id="eform" novalidate>
<h2 id="eh">Enrol new subject</h2>
<label for="e-id">Device ID</label><input id="e-id" placeholder="LEMON-013" autocomplete="off" autocapitalize="characters">
<label for="e-class">Device class</label><select id="e-class"><option value="personal">Personal (phone, watch)</option><option value="vehicular">Vehicular (OBD, telematics)</option><option value="fixed">Fixed (sensor, camera)</option><option value="imaging">Imaging (drone, LiDAR)</option></select>
<label for="e-tier">Tier ceiling</label><select id="e-tier"><option value="T1" disabled>T1 needs a secure-element device. Not available from a browser.</option><option value="T2" selected>T2 · documented</option><option value="T3">T3 · claimed</option><option value="T4">T4 · hearsay</option></select>
<label for="e-consent">Consent basis (POPIA)</label><input id="e-consent" placeholder="Landowner consent, operator policy…">
<div class="two"><div><label for="e-lat">Latitude</label><input id="e-lat" inputmode="decimal" value="-26.2200"></div><div><label for="e-lng">Longitude</label><input id="e-lng" inputmode="decimal" value="28.1700"></div></div>
<div id="e-err" role="alert"></div><pre id="e-res"></pre>
<div class="acts"><button type="button" id="e-gps">use my location</button><button type="button" id="e-cancel">close</button><button type="submit" id="e-ok" style="border-color:var(--lime);color:var(--lime)">sign &amp; enrol</button></div>
</form></dialog>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const notice=t=>{const n=$('notice');n.style.display='flex';n.textContent=t};
if(!window.THREE||!THREE.OrbitControls){notice('Three.js could not be loaded. Check your connection and reload.');return}
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true})}catch(e){notice('WebGL is unavailable. Turn on hardware acceleration and reload.');return}

/* ---- data ---- */
const SURFACES=[['19','Spatial Intelligence','markers',true],['20','Surveillance Monitor','not built here',false],['21','Digital Twin Hologram','hologram',true],['22','Authority Gate','not built here',false],['23','Evidence Instrument','not built here',false],['24','3D Model Viewer','your /models folder',true],['25','Brand Collective','not built here',false],['26','Condition Map Twin','health field',true]];
const ASSETS=[
 {id:'LEMON-001',lat:-26.2206,lng:28.1762,health:84,tier:'T1',kind:'tree'},
 {id:'LEMON-007',lat:-26.2209,lng:28.1763,health:61,tier:'T2',kind:'tree'},
 {id:'PIPC-J01',lat:-26.2198,lng:28.1695,health:91,tier:'T2',kind:'pipe'},
 {id:'PIPC-J02',lat:-26.2193,lng:28.1699,health:96,tier:'T2',kind:'pipe'},
 {id:'RESERVOIR-M',lat:-26.2194,lng:28.1700,health:100,tier:'T1',kind:'tank'},
 {id:'RESERVOIR-S',lat:-26.2203,lng:28.1700,health:78,tier:'T2',kind:'tank'},
 {id:'SENSOR-MAST',lat:-26.2200,lng:28.1697,health:100,tier:'T1',kind:'mast'}];
const TIER={T1:{c:0xa3e635,op:1,dash:false},T2:{c:0x00e5ff,op:.85,dash:true},T3:{c:0xffb224,op:.6,dash:false},T4:{c:0xe5484d,op:.35,dash:false}};

/* ---- Mercator (same math as MercatorCoordinate.fromLngLat) -> local metres ---- */
const merc=(lng,lat)=>[(lng+180)/360,.5-Math.log(Math.tan(Math.PI/4+lat*Math.PI/360))/(2*Math.PI)];
const o=ASSETS.reduce((a,s)=>[a[0]+s.lng/ASSETS.length,a[1]+s.lat/ASSETS.length],[0,0]);
const [ox,oy]=merc(o[0],o[1]);const M=40075016.686*Math.cos(o[1]*Math.PI/180),U=15; // 1 scene unit = 15 m
const place=a=>{const [x,y]=merc(a.lng,a.lat);return [(x-ox)*M/U,(y-oy)*M/U]}; // +y mercator = south = +z

/* ---- scene ---- */
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07090a);
const cam=new THREE.PerspectiveCamera(45,1,.1,2000);
const ctl=new THREE.OrbitControls(cam,renderer.domElement);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI/2-.04;
scene.add(new THREE.GridHelper(200,40,0x26302b,0x131b17));

function holo(c,h,op){return new THREE.ShaderMaterial({uniforms:{uC:{value:new THREE.Color(c)},uH:{value:h/100},uO:{value:op},uT:{value:0}},
 vertexShader:'varying vec3 vN;varying vec3 vV;varying float vY;void main(){vN=normalize(normalMatrix*normal);vec4 m=modelViewMatrix*vec4(position,1.);vV=-m.xyz;vY=position.y;gl_Position=projectionMatrix*m;}',
 fragmentShader:'uniform vec3 uC;uniform float uH,uO,uT;varying vec3 vN;varying vec3 vV;varying float vY;void main(){float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),2.);vec3 sick=mix(vec3(.9,.2,.2),vec3(1.,.7,.1),uH);vec3 c=mix(sick,uC,smoothstep(.3,.8,uH));float s=.8+.2*sin(vY*20.+uT*5.);gl_FragColor=vec4(c*(.5+f*1.5),(.2+f*.8)*s*uO);}',
 transparent:true,depthWrite:false,side:THREE.DoubleSide})}
const mk=(g,m,x=0,y=0,z=0)=>{const e=new THREE.Mesh(g,m);e.position.set(x,y,z);return e};
const BUILD={
 tree:m=>{const g=new THREE.Group();g.add(mk(new THREE.CylinderGeometry(.2,.4,3,6),m,0,1.5,0));[[.3,.2],[-.4,.1],[0,-.4],[.2,.5],[-.2,-.1]].forEach((p,i)=>g.add(mk(new THREE.IcosahedronGeometry(1.2,0),m,p[0],3.5+i*.15,p[1])));return g},
 pipe:m=>{const g=new THREE.Group(),a=mk(new THREE.CylinderGeometry(.3,.3,4,8),m,0,.5,0);a.rotation.z=Math.PI/2;g.add(a,mk(new THREE.CylinderGeometry(.3,.3,2,8),m,0,1.5,0));return g},
 tank:m=>{const g=new THREE.Group();g.add(mk(new THREE.CylinderGeometry(2,2,4,16),m,0,2,0),mk(new THREE.SphereGeometry(2,16,8,0,Math.PI*2,0,Math.PI/2),m,0,4,0));return g},
 device:m=>{const g=new THREE.Group();g.add(mk(new THREE.BoxGeometry(1.2,1.2,1.2),m,0,.6,0),mk(new THREE.CylinderGeometry(.05,.05,2,5),m,0,2.2,0));return g},
 mast:m=>{const g=new THREE.Group();g.add(mk(new THREE.CylinderGeometry(.1,.2,8,6),m,0,4,0),mk(new THREE.BoxGeometry(2,.1,.1),m,0,7,0));return g}};

const nodes=[],mats=[],rings=[];
function addAsset(a){
 if(!BUILD[a.kind]){console.error('Unknown asset kind, skipped:',a.id,a.kind);return null}
 const t=TIER[a.tier]||TIER.T4,[x,z]=place(a);
 const m=holo(t.c,a.health==null?50:a.health,t.op),g=BUILD[a.kind](m);g.position.set(x,0,z);g.userData=a;scene.add(g);nodes.push(g);mats.push(m);
 const pts=[];for(let i=0;i<=48;i++){const r=i/48*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(r)*2.6,.05,Math.sin(r)*2.6))}
 const geo=new THREE.BufferGeometry().setFromPoints(pts);
 const lm=t.dash?new THREE.LineDashedMaterial({color:t.c,dashSize:.35,gapSize:.25,transparent:true,opacity:t.op}):new THREE.LineBasicMaterial({color:t.c,transparent:true,opacity:t.op});
 const ring=new THREE.Line(geo,lm);ring.computeLineDistances();ring.position.set(x,0,z);scene.add(ring);rings.push(ring);
 return g}
ASSETS.forEach(addAsset);
if(!nodes.length){notice('No renderable assets. Every record had an unknown kind.');return}

/* condition field: inverse-distance weighted asset health (real record values, no synthetic waves) */
const fm=new THREE.ShaderMaterial({uniforms:{uP:{value:nodes.map(n=>new THREE.Vector3(n.position.x,n.position.z,n.userData.health/100))}},
 vertexShader:'varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 uP['+nodes.length+'];varying vec2 vP;void main(){float w=0.,h=0.;for(int i=0;i<'+nodes.length+';i++){float d=distance(vP,uP[i].xy)+.5;float k=1./(d*d);w+=k;h+=k*uP[i].z;}h/=w;vec3 c=mix(vec3(.9,.2,.2),vec3(.64,.9,.2),smoothstep(.4,1.,h));gl_FragColor=vec4(c*.55,.7);}',
 transparent:true,depthWrite:false});
const field=new THREE.Mesh(new THREE.PlaneGeometry(200,200),fm);field.rotation.x=-Math.PI/2;field.position.y=.01;field.visible=false;scene.add(field);

/* ---- sizing: ResizeObserver on #stage ---- */
new ResizeObserver(()=>{const s=$('stage'),w=s.clientWidth,h=s.clientHeight;if(!w||!h)return;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();frame()}).observe($('stage'));
function frame(){const b=new THREE.Box3();nodes.forEach(n=>b.expandByObject(n));const c=b.getCenter(new THREE.Vector3()),r=Math.max(b.getSize(new THREE.Vector3()).length(),20)*.5;
 const d=r/Math.sin(cam.fov*Math.PI/360)*(cam.aspect<1?1.1/cam.aspect:1.15);ctl.target.copy(c);cam.position.copy(c).add(new THREE.Vector3(.6,.7,.9).normalize().multiplyScalar(d));cam.far=d*6;cam.updateProjectionMatrix()}

/* ---- Model Viewer (#24): renders the /public/models folder ---- */

const viewer=new THREE.Group();viewer.visible=false;scene.add(viewer);
const vmats=[];let cur=null,curObj=null,texOn=false,vtok=0;
const b64=s=>{const r=atob(s),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u.buffer};
function vclear(){while(viewer.children.length)viewer.remove(viewer.children[0]);vmats.length=0;curObj=null}
function vhud(m,src,extra){$('hud').innerHTML=[['model',m.name],['format',m.fmt.toUpperCase()],['source',src],['detail',extra||'']].map(p=>'<div class="r"><span>'+p[0]+'</span><span>'+p[1]+'</span></div>').join('')}
function vshow(obj,m,src){
 vclear();const b=new THREE.Box3().setFromObject(obj),sz=b.getSize(new THREE.Vector3()),k=14/Math.max(sz.x,sz.y,sz.z,1e-6);
 obj.scale.multiplyScalar(k);b.setFromObject(obj);const c=b.getCenter(new THREE.Vector3());obj.position.sub(c);b.setFromObject(obj);obj.position.y-=b.min.y;
 let meshes=0,tris=0;obj.traverse(o=>{if(o.isMesh){meshes++;o.userData.orig=o.material;const g=o.geometry;tris+=(g.index?g.index.count:g.attributes.position.count)/3;
  const hm=holo(0xa3e635,100,1);o.userData.holo=hm;vmats.push(hm);o.material=texOn?o.userData.orig:hm}});
 viewer.add(obj);curObj=obj;vhud(m,src,meshes+' meshes · '+Math.round(tris).toLocaleString()+' tris');
 const bb=new THREE.Box3().setFromObject(viewer),cc=bb.getCenter(new THREE.Vector3());ctl.target.copy(cc);cam.position.copy(cc).add(new THREE.Vector3(.8,.5,1).normalize().multiplyScalar(26));
 $('tex').hidden=!meshes}
function vpoints(m){vclear();const f=new Float32Array(b64(EMB.wire)),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(f,3));
 const p=new THREE.Points(g,new THREE.PointsMaterial({color:0xa3e635,size:.12,transparent:true,opacity:.9}));p.scale.setScalar(7);p.position.y=7;viewer.add(p);
 ctl.target.set(0,7,0);cam.position.set(14,11,18);vhud(m,'wireframe.json (embedded)','4,041 sampled points · full glTF loads from /models when served')}
function parseBuf(m,buf,mgr){mgr=mgr||new THREE.LoadingManager();
 if(m.fmt==='fbx'){if(!THREE.FBXLoader)throw new Error('FBXLoader missing');return Promise.resolve(new THREE.FBXLoader(mgr).parse(buf,''))}
 return new Promise((ok,no)=>new THREE.GLTFLoader(mgr).parse(buf,'',g=>ok(g.scene),no))}
async function loadModel(m){const t=++vtok;cur=m;[...$('chips').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===m.id));
 $('pickb').hidden=false;if(m.pts)vpoints(m);else{vclear();vhud(m,'loading…')}
 try{
  if(m.emb){const o=await parseBuf(m,b64(EMB[m.emb]));if(t===vtok)vshow(o,m,'embedded in page');return}
  if(m.fmt==='gltf'){await new Promise((ok,no)=>new THREE.GLTFLoader().load(m.url,g=>{if(t===vtok)vshow(g.scene,m,'server '+m.url);ok()},undefined,no));return}
  const r=await fetch(m.url);if(!r.ok)throw new Error('HTTP '+r.status);const o=await parseBuf(m,await r.arrayBuffer());if(t===vtok)vshow(o,m,'server '+m.url);
 }catch(e){if(t!==vtok)return;if(!m.pts)vhud(m,'not found on this host','tap "load files": '+m.hint);else console.warn(e)}}
$('pickb').onclick=()=>$('pf').click();
$('pf').onchange=async e=>{const fs=[...e.target.files],urls=new Map();fs.forEach(f=>urls.set(f.name.toLowerCase(),URL.createObjectURL(f)));
 const f=fs.find(f=>/\.(fbx|glb|gltf)$/i.test(f.name));if(!f){vhud(cur||MODELS[0],'no model file in selection');return}
 const mgr=new THREE.LoadingManager();mgr.setURLModifier(u=>urls.get(decodeURIComponent(u.split(/[\\/]/).pop().split('?')[0]).toLowerCase())||u);
 const m=Object.assign({},cur||MODELS[0],{fmt:/\.fbx$/i.test(f.name)?'fbx':'gltf'});
 try{const o=await parseBuf(m,m.fmt==='gltf'&&!/\.glb$/i.test(f.name)?await f.text():await f.arrayBuffer(),mgr);vshow(o,m,'file: '+f.name+' (+'+(fs.length-1)+' files)')}catch(err){vhud(m,'load failed',err.message)}};
$('tex').onclick=ev=>{texOn=!texOn;ev.currentTarget.setAttribute('aria-pressed',texOn);if(curObj)curObj.traverse(o=>{if(o.isMesh)o.material=texOn?o.userData.orig:o.userData.holo})};

let activeSurface='21',selected=null; // declared before any timer starts

function pick(a){selected=a;hud(a);[...$('chips').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===a.id))}
function surface(id){activeSurface=id;const s=SURFACES.find(x=>x[0]===id);$('mode').textContent='#'+id+' '+s[1];
 nodes.forEach(n=>n.visible=id==='21');rings.forEach(r=>r.visible=id==='19'||id==='21');field.visible=id==='26';viewer.visible=id==='24';setChips(id==='24'?'m':'a');if(id==='24'){loadModel(cur||MODELS[0])}else{hud(selected);frame()}
 document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute(b.parentElement.id==='surf'?'aria-selected':'aria-pressed',b.dataset.s===id))}
SURFACES.forEach(s=>['side','surf'].forEach(p=>{const b=document.createElement('button');b.dataset.s=s[0];b.innerHTML='#'+s[0]+' '+s[1]+(p==='side'?'<small>'+s[2]+'</small>':'');
 if(!s[3])b.setAttribute('aria-disabled','true');if(p==='surf')b.setAttribute('role','tab');b.onclick=()=>{if(s[3])surface(s[0])};$(p).appendChild(b)}));
function setChips(mode){const c=$('chips');c.innerHTML='';(mode==='m'?MODELS:ASSETS).forEach(a=>{const b=document.createElement('button');b.dataset.id=a.id;b.textContent=a.name||a.id;b.onclick=()=>mode==='m'?loadModel(a):pick(a);c.appendChild(b)});$('pickb').hidden=$('tex').hidden=mode!=='m'}

cv.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;down=null;
 const r=cv.getBoundingClientRect(),rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),cam);
 const h=rc.intersectObjects(nodes.filter(n=>n.visible),true)[0];if(!h)return;let n=h.object;while(n&&!n.userData.id)n=n.parent;if(n)pick(n.userData)});

/* ---- evidence beats (simulated). Cap by width; fog-of-war at 3 x cadence ---- */
const CAD=1400,tl=$('tl');let last=performance.now(),outage=false;
$('out').onclick=e=>{outage=!outage;e.currentTarget.setAttribute('aria-pressed',outage)};
function cap(){return Math.max(8,Math.floor(tl.clientWidth/8))}
function beat(){const now=performance.now();if(outage)return;
 const dt=now-last;if(dt>CAD*3){const g=document.createElement('div');g.className='gap';g.textContent=Math.round(dt/1000)+'s blind';tl.appendChild(g)}
 const a=ASSETS[Math.floor(Math.random()*ASSETS.length)],m=document.createElement('div');m.className='m';m.style.background='#'+(TIER[a.tier]||TIER.T4).c.toString(16).padStart(6,'0');m.title=a.id;tl.appendChild(m);
 last=now;while(tl.children.length>cap())tl.removeChild(tl.firstChild)}
setInterval(beat,CAD);

const D=$('enrol'),E=id=>$('e-'+id);let K=null,prev='0'.repeat(64);const chain=[];
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const alg=c=>c==='Ed25519'?{name:'Ed25519'}:{name:'ECDSA',hash:'SHA-256'};
const canon=o=>JSON.stringify(Object.keys(o).sort().reduce((r,k)=>(r[k]=o[k],r),{}));
async function getKey(){if(K)return K;let p,c;try{p=await crypto.subtle.generateKey({name:'Ed25519'},false,['sign','verify']);c='Ed25519'}catch(e){p=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},false,['sign','verify']);c='P-256'}
 K={p,c,pub:hex(await crypto.subtle.exportKey('raw',p.publicKey))};return K}
$('add').onclick=()=>{E('res').textContent='';E('err').textContent='';D.showModal()};
$('e-cancel').onclick=()=>D.close();
$('e-gps').onclick=()=>{if(!navigator.geolocation){E('err').textContent='GPS unavailable on this device.';return}
 navigator.geolocation.getCurrentPosition(p=>{E('lat').value=p.coords.latitude.toFixed(5);E('lng').value=p.coords.longitude.toFixed(5)},()=>{E('err').textContent='GPS unavailable. Enter coordinates by hand.'})};
$('eform').onsubmit=async ev=>{ev.preventDefault();const er=E('err');er.textContent='';
 const id=E('id').value.trim().toUpperCase(),lat=parseFloat(E('lat').value),lng=parseFloat(E('lng').value),cb=E('consent').value.trim();
 if(!/^[A-Z0-9][A-Z0-9-]{2,31}$/.test(id)){er.textContent='Device ID: 3 to 32 characters, A-Z, 0-9 and dashes.';return}
 if(ASSETS.some(a=>a.id===id)){er.textContent='That Device ID is already enrolled.';return}
 if(!(lat>=-90&&lat<=90&&lng>=-180&&lng<=180)){er.textContent='Enter a valid latitude and longitude.';return}
 if(cb.length<5){er.textContent='Consent basis is required (POPIA).';return}
 try{const k=await getKey(),payload={event:'ENROLMENT',device:id,class:E('class').value,tier_ceiling:E('tier').value,consent_basis:cb,lat,lng,ts:new Date().toISOString(),prev};
  const enc=new TextEncoder(),digest=hex(await crypto.subtle.digest('SHA-256',enc.encode(prev+canon(payload))));
  const sig=await crypto.subtle.sign(alg(k.c),k.p.privateKey,enc.encode(digest));
  if(!await crypto.subtle.verify(alg(k.c),k.p.publicKey,sig,enc.encode(digest)))throw new Error('signature did not verify');
  prev=digest;chain.push({payload,digest});
  const a={id,kind:'device',lat,lng,health:null,tier:'T4',ceiling:payload.tier_ceiling,class:payload.class,last_scan:'never'};ASSETS.push(a);
  const g=addAsset(a);if(g){g.visible=activeSurface==='21';rings[rings.length-1].visible=activeSurface==='19'||activeSurface==='21'}
  setChips(activeSurface==='24'?'m':'a');if(activeSurface!=='24')pick(a);
  E('res').textContent='Enrolled '+id+' · tier T4 until a device observation arrives\nchain #'+chain.length+' digest '+digest.slice(0,16)+'…\ncurve '+k.c+' · isolation BROWSER · verified in this browser\nsession key, not saved. Record kept in this page only: not sent to Bridge-Cron or a database.';
  E('id').value='';E('consent').value='';
 }catch(x){er.textContent='Signing failed: '+x.message}};
surface('21');hud(null);
const clk=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const t=clk.getElapsedTime();ctl.update();for(const m of mats)m.uniforms.uT.value=t;for(const m of vmats)m.uniforms.uT.value=t;renderer.render(scene,cam)})();
})();
</script>
